<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Acorn Lamp, section through the printed lattice shell">
  <defs>
    <pattern id="hex" width="28" height="48" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 12 L28 36 L14 48 L0 36 L0 12 Z" fill="none" stroke="#efeae1" stroke-width="1.4"/>
    </pattern>
    <clipPath id="half"><path d="M800 140 C 960 140 1030 290 1020 420 C 1010 560 910 660 800 690 Z"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="#a8743f"/>
  <!-- left half: outer shell -->
  <path d="M800 140 C 640 140 570 290 580 420 C 590 560 690 660 800 690 Z" fill="#efeae1" stroke="#1c1a17" stroke-width="2.5"/>
  <!-- right half: cutaway lattice -->
  <rect x="790" y="130" width="250" height="570" fill="url(#hex)" clip-path="url(#half)"/>
  <path d="M800 140 C 960 140 1030 290 1020 420 C 1010 560 910 660 800 690" fill="none" stroke="#1c1a17" stroke-width="2.5"/>
  <path d="M800 140 C 940 160 995 300 985 420 C 975 545 890 640 800 664" fill="none" stroke="#1c1a17" stroke-width="1.5" stroke-dasharray="4 6"/>
  <path d="M800 110 V 800" stroke="#1c1a17" stroke-width="1.5" stroke-dasharray="8 8"/>
  <!-- light source -->
  <circle cx="800" cy="420" r="34" fill="#f6d9a6" stroke="#1c1a17" stroke-width="2"/>
  <g stroke="#f6d9a6" stroke-width="2" stroke-linecap="round">
    <path d="M846 420 h40M800 374 v-40M800 466 v40M832 388 l28 -28M832 452 l28 28"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="16" fill="#1c1a17" letter-spacing="1.2">
    <g stroke="#1c1a17" stroke-width="1"><path d="M600 300 H400M970 260 H1180M1000 540 H1180"/></g>
    <text x="384" y="305" text-anchor="end">CONTINUOUS OUTER SHELL</text>
    <text x="1196" y="265">INTERNAL LATTICE</text>
    <text x="1196" y="285" fill="#efeae1">DIFFUSES · STIFFENS</text>
    <text x="1196" y="545">NO SEAMS, NO JOINTS</text>
    <text x="80" y="90" fill="#efeae1">FIG. 03 — HALF SECTION</text>
    <text x="80" y="850" fill="#efeae1">PRINTED AS ONE BODY</text>
  </g>
</svg>
