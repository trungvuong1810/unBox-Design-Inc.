    <text x="560" y="760" text-anchor="middle">02 RIGID HOUSING</text>
    <text x="815" y="760" text-anchor="middle">03 FILTER MEDIA</text>
    <text x="1030" y="760" text-anchor="middle">04 TWIST CAP</text>
    <text x="1250" y="760" text-anchor="middle" fill="#a8743f">AIR IN</text>
    <text x="80" y="90" fill="#a39b8d">FIG. 02 — LAYER STACK, SIDE SECTION</text>
    <text x="80" y="850" fill="#a39b8d">SWAP MEDIA · CLEAN · REUSE</text>
